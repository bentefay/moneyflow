packages:
    - .

allowBuilds:
    esbuild: false
    sharp: false
    supabase: true
    unrs-resolver: false

# Mirrors safe-chain's own minimum package age, measured at 2 days: it suppresses releases at 1.84
# days and allows them at 2.80. Expressed in minutes, so 2880.
#
# Keep these two numbers equal. safe-chain gates at DOWNLOAD and pnpm gates at RESOLUTION, so
# without this pnpm happily locks a version safe-chain then refuses to fetch — which is how a
# committed lockfile came to fail `pnpm install --frozen-lockfile` with a 403 in a fresh checkout
# while resolving fine here. Matching them means the lockfile can only hold installable versions.
#
# This narrows the gap rather than closing it: the two gates run at different stages and will drift
# again if safe-chain changes its default. If an install 403s on a fresh clone, re-measure both.
minimumReleaseAge: 2880

overrides:
    "@babel/core@<7.29.1": 7.29.7
    "@tootallnate/once@<2.0.1": 2.0.1
    "ajv@>=7.0.0-alpha.0 <8.18.0": 8.20.0
    "brace-expansion@>=5.0.0 <5.0.6": 5.0.7
    "js-yaml@>=4.0.0 <=4.1.1": 4.3.0
    "minimatch@>=10.0.0 <10.2.3": 10.2.5
    "path-to-regexp@>=4.0.0 <6.3.0": 6.3.0
    "path-to-regexp@>=8.0.0 <8.4.0": 8.4.2
    "postcss@<8.5.10": 8.5.19
    "sharp@<0.35.0": 0.35.3
    "smol-toml@<1.6.1": 1.7.0
    "tar@<7.5.16": 7.5.20
