                        h`<h3>Delete rule ${r.id}?</h3><p class="small">${n} transaction${n === 1 ? "" : "s"} keep their current values. Nothing applies to future imports.</p><div class="actions"><button class="btn danger" type="button" data-act="confirm-delete-rule" data-rule="${r.id}">Delete rule</button><button class="btn" type="button" data-act="close">Cancel</button></div>`
                    );
                }
                if (a === "confirm-delete-rule") {
                    closeDialog();
                    S.rules = S.rules.filter((x) => x !== r);
                    if (S.selectedRule === r.id) S.selectedRule = null;
                    toast("Deleted " + r.id + ".");
                    return render();
                }
                if (a === "split") {
                    const f = b.dataset.field;
                    const rest = outputFields(r).filter((x) => x !== f);
                    return openDialog(
                        h`<h3>Split ${fieldLabel(f).toLowerCase()} into its own rule</h3><p class="small">Both rules keep the same conditions and the same reach: ${esc(reachLabel(r, S.transactions))}. No transaction changes.</p><div class="two"><div class="mini"><strong>${r.id}</strong><span class="muted">${esc(condLabel(r))}</span>${rest.map((x) => h`<span>${fieldLabel(x)}: ${esc(valueLabel(x, r.outputs[x]))}</span>`).join("")}</div><div class="mini"><strong>New rule</strong><span class="muted">${esc(condLabel(r))}</span><span>${fieldLabel(f)}: ${esc(valueLabel(f, r.outputs[f]))}</span></div></div><div class="actions"><button class="btn primary" type="button" data-act="confirm-split" data-rule="${r.id}" data-field="${f}">Split</button><button class="btn" type="button" data-act="close">Cancel</button></div>`
                    );
                }
                if (a === "confirm-split") {
                    S.events.add("split");
                    closeDialog();
                    const f = b.dataset.field;
                    const n = mkRule({
                        text: r.text,
                        account: r.account,
                        amount: r.amount,
                        outputs: { [f]: r.outputs[f] },
                        reach: cloneReach(r.reach)
                    });
                    delete r.outputs[f];
                    S.rules.push(n);
                    toast(
                        "Split: " +
                            n.id +
                            " now carries " +
                            fieldLabel(f).toLowerCase() +
                            " with the same reach."
                    );
                    return render();
                }
                if (a === "new-rule") {
                    S.selectedRule = null;
                    delete S.drafts.__new;
                    return render();
                }
                if (a === "cancel-new") {
                    delete S.drafts.__new;
                    return render();
                }
                if (a === "create-rule") {
                    S.events.add("pageCreate");
                    const d = S.drafts.__new;
                    const n = mkRule({
                        text: d.text,
                        account: d.account,
                        outputs: { tags: { mode: "add", tags: d.tags } },
                        reach: cloneReach(d.reach)
                    });
                    const c = collision(S.rules, n, "tags", null);
                    if (c) {
                        toast(
                            "Refused: " +
                                c.id +
                                " already holds tags for " +
                                condLabel(c) +
                                " at that reach."
                        );
                        return;
                    }
                    S.rules.push(n);
                    const pop = governedBy(n, S.transactions).filter((x) =>
                        outputFields(n).some((f) => winner(S.rules, x, f) === n)
                    );
                    for (const x of pop) setRow(x.id, (y) => applyWinning(n, y));
                    delete S.drafts.__new;
                    S.selectedRule = n.id;
                    toast("Saved " + n.id + "; applied to " + pop.length + " transactions.");
                    return render();
                }
            }
            reset();
        </script>
    </body>
</html>
