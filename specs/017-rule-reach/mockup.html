    <body>
        <header class="top">
            <h1>Rule reach — interactive mockup</h1>
            <span class="banner"
                >Proposed design for specs/017-rule-reach/spec.md. Synthetic data; nothing
                persists.</span
            >
            <span class="muted small"
                >Click a cell to edit it. Enter commits, Escape cancels. The inspector follows the
                active row.</span
            >
        </header>
        <nav class="tabs" id="tabs" aria-label="Views">
            <button type="button" data-view="transactions" aria-current="true">Transactions</button>
            <button type="button" data-view="automations" aria-current="false">Automations</button>
            <span class="spacer"></span>
            <button type="button" class="btn sm" data-act="reset">Reset data</button>
        </nav>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <script>
            "use strict";
            // ---------------------------------------------------------------------------------------------
            // Synthetic data
            // ---------------------------------------------------------------------------------------------
            const PEOPLE = ["Alex", "Sam"];
            const ACCOUNTS = { A: "Everyday", B: "Credit card" };
            const ALIASES = ["Coffee", "Cafe", "Groceries", "Rent"];
            const TAGS = ["coffee", "work", "home", "food"];
            const TEXT = "COFFEE SHOP 123";
            const money = (m) => (m < 0 ? "−" : "") + "$" + (Math.abs(m) / 100).toFixed(2);
            const fmtDate = (d) =>
                new Date(d + "T00:00:00").toLocaleDateString("en-AU", {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                });
            const FIELDS = ["alias", "tags", "alloc"];
            const fieldLabel = (f) =>
                ({ alias: "Description", tags: "Tags", alloc: "Allocation" })[f];

            function tx(id, date, account, amount, extra = {}) {
                return {
                    id,
                    date,
                    text: TEXT,
                    account,
                    amount,
                    alias: null,
                    tags: [],
                    alloc: { Alex: null, Sam: null },
                    ...extra
                };
            }
            function baseTransactions() {
                return [
                    tx("A", "2026-07-02", "A", -450),
                    tx("B", "2026-07-25", "A", -450),
                    tx("C", "2026-08-03", "B", -600),
                    tx("K", "2026-08-02", "A", -180000, { text: "RENT 14 AUGUST", alias: "Rent" }),
                    tx("L", "2026-08-05", "A", -3200, { text: "BOOKSTORE 99" })
                ];
            }
            let nextRuleId = 1;
            function mkRule(r) {
                return {
                    id: r.id ?? "R" + nextRuleId++,
                    text: TEXT,
                    account: null,
                    amount: null,
                    outputs: {},
                    reach: { kind: "ids", ids: new Set() },
                    ...r
                };
            }

            // ---------------------------------------------------------------------------------------------
            // Engine: the spec, simulated
            // ---------------------------------------------------------------------------------------------
            const condRank = (r) => (r.account ? 2 : 0) + (r.amount != null ? 1 : 0);
            const dayNumber = (d) => Math.floor(Date.parse(d + "T00:00:00Z") / 86400000);
            // Reach is the most significant dimension: these transactions, then the latest from-date,
            // then earlier from-dates, then all. Conditions decide within a tier and date.
            const reachRank = (r) =>
                r.reach.kind === "ids"
                    ? 3e7
                    : r.reach.kind === "from"
                      ? 1e7 + dayNumber(r.reach.date) * 10
                      : 0;
            const rank = (r) => reachRank(r) + condRank(r);
            const matches = (r, t) =>
                r.text === t.text &&
                (r.account == null || r.account === t.account) &&
                (r.amount == null || r.amount === t.amount);
            function reaches(r, t) {
                if (r.reach.kind === "all") return true;
                if (r.reach.kind === "from") return t.date >= r.reach.date;
                return r.reach.ids.has(t.id);
            }
            const governs = (r, t) => matches(r, t) && reaches(r, t);
            const outputFields = (r) => FIELDS.filter((f) => r.outputs[f] != null);
            function winner(rules, t, field) {
                return (
                    rules
                        .filter((r) => r.outputs[field] != null && governs(r, t))
                        .sort((a, b) => rank(b) - rank(a) || b.id.localeCompare(a.id))[0] ?? null
                );
            }
            function agrees(r, t, field) {
                if (field === "alias") return (t.alias ?? "") === r.outputs.alias;
                if (field === "tags") return r.outputs.tags.tags.every((x) => t.tags.includes(x));
                return PEOPLE.every((p) => t.alloc[p] === r.outputs.alloc[p]);
            }
            function applyOutput(t, field, out) {
                const n = { ...t, tags: [...t.tags], alloc: { ...t.alloc } };
                if (field === "alias") n.alias = out || null;
                if (field === "tags")
                    n.tags =
                        out.mode === "set" ? [...out.tags] : [...new Set([...t.tags, ...out.tags])];
                if (field === "alloc") n.alloc = { ...out };
                return n;
            }
            function applyRuleTo(r, t) {
                let n = t;
                for (const f of outputFields(r)) n = applyOutput(n, f, r.outputs[f]);
                return n;
            }
            // Apply only the fields this rule wins for the row, so a one-row rule keeps its own row.
            function applyWinning(r, t, rules = S.rules) {
                let n = t;
                for (const f of outputFields(r))
                    if (winner(rules, t, f) === r) n = applyOutput(n, f, r.outputs[f]);
                return n;
            }
            const sameConds = (a, b) =>
                a.text === b.text && a.account === b.account && a.amount === b.amount;
            function reachLabel(r, transactions) {
                if (r.reach.kind === "all") return "all matching transactions";
                if (r.reach.kind === "from") return "from " + fmtDate(r.reach.date) + " onward";
                const n = [...r.reach.ids].filter((id) =>
                    transactions.some((t) => t.id === id)
                ).length;
                return n === 0
                    ? "not applied anywhere"
                    : n === 1
                      ? "1 specific transaction"
                      : n + " specific transactions";
            }
            const condLabel = (r) =>
                [
                    r.text,
                    r.account ? ACCOUNTS[r.account] : "any account",
                    r.amount != null ? money(r.amount) : "any amount"
                ].join(" · ");
            function valueLabel(field, v) {
                if (v == null) return "—";
                if (field === "alias")
                    return v === "" ? "clear the alias" : "rename to “" + v + "”";
                if (field === "tags")
                    return (
                        (v.mode === "set" ? "set " : "add ") +
                        (v.tags.length ? v.tags.map((x) => "#" + x).join(" ") : "nothing")
                    );
                return PEOPLE.map((p) => p + " " + (v[p] == null ? "—" : v[p] + "%")).join(" / ");
            }
            function rowValue(field, t) {
                if (field === "alias") return t.alias;
                if (field === "tags") return { mode: "add", tags: [...t.tags] };
                return { ...t.alloc };
            }
            function rowValueLabel(field, t) {
                if (field === "alias") return t.alias ? "“" + t.alias + "”" : "no alias";
                if (field === "tags")
                    return t.tags.length ? t.tags.map((x) => "#" + x).join(" ") : "no tags";
                return PEOPLE.map(
                    (p) => p + " " + (t.alloc[p] == null ? "—" : t.alloc[p] + "%")
                ).join(" / ");
            }
            // Uniqueness: one rule per field per conditions slot per reach kind; ids rules must be disjoint.
            // Uniqueness per field and conditions slot: one all rule, one from rule per date, and
            // explicit-set rules with disjoint sets.
            function collision(rules, candidate, field, excludeId) {
                for (const r of rules) {
                    if (r.id === excludeId || r.outputs[field] == null || !sameConds(r, candidate))
                        continue;
                    if (r.reach.kind !== candidate.reach.kind) continue;
                    if (candidate.reach.kind === "all") return r;
                    if (candidate.reach.kind === "from") {
                        if (r.reach.date === candidate.reach.date) return r;
                        continue;
                    }
                    for (const id of candidate.reach.ids) if (r.reach.ids.has(id)) return r;
                }
                return null;
            }
            // Population a rule WOULD govern under a reach, that would actually change.
            function populationUnder(rule, reach, transactions, field) {
                const probe = { ...rule, reach };
                return transactions.filter(
                    (t) => governs(probe, t) && !agrees(rule, t, field ?? outputFields(rule)[0])
                );
            }
            function governedBy(rule, transactions) {
                return transactions.filter((t) => governs(rule, t));
            }

            // ---------------------------------------------------------------------------------------------
            // State
            // ---------------------------------------------------------------------------------------------
            let S;
            function reset() {
                nextRuleId = 1;
                S = {
                    view: "transactions",
                    transactions: baseTransactions(),
                    rules: [],
                    activeRow: "B",
                    editing: null,
                    drafts: {},
                    selectedRule: null,
                    done: new Set(),
                    changed: new Set(),
                    importDate: "2026-06-01",
                    prefs: { reach: "from", autoApply: false },
                    pending: {},
                    override: false,
                    events: new Set()
                };
                render();
            }
            const activeTx = () => S.transactions.find((t) => t.id === S.activeRow) ?? null;
            const ruleById = (id) => S.rules.find((r) => r.id === id);
            const esc = (s) =>
                String(s).replace(
                    /[&<>"]/g,
                    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
                );
            const h = (strings, ...vals) =>
                strings.reduce((a, s, i) => a + s + (i < vals.length ? vals[i] : ""), "");
            function toast(msg) {
                const el = document.getElementById("toast");
                el.textContent = msg;
                el.classList.add("show");
                clearTimeout(toast.t);
                toast.t = setTimeout(() => el.classList.remove("show"), 3600);
            }

            // The spec's worked examples, as a checklist the user performs by hand.
            const CHECKLIST = [
                [
                    "E1",
                    "Set reach to <em>this transaction only</em> and automatic off. On row <strong>B</strong>, click the Tags cell, tick <code>work</code>, press Enter.",
                    "A one-row rule R1 appears for B. Rows A and C are untouched and not orange."
                ],
                [
                    "E2",
                    "On row <strong>A</strong>, tick <code>home</code>, press Enter.",
                    "A second one-row rule R2 on the same text. The two coexist."
                ],
                [
                    "E3",
                    "Click row <strong>B</strong> again. On R1's card choose <em>From 25 Jul</em> and Save.",
                    "Row C receives <code>work</code>. Row A keeps <code>home</code>."
                ],
                [
                    "E4",
                    "Import a row dated 1 Jun.",
                    "The new row I1 is reached by neither rule. No tag."
                ],
                [
                    "E5",
                    "Import a row dated 10 Aug.",
                    "The new row I2 is reached by R1 on arrival and receives <code>work</code>."
                ],
                [
                    "E6",
                    "Click row <strong>B</strong>. On R1's card choose <em>All</em> and Save.",
                    "I1 gets <code>work</code>. Row A still shows only <code>home</code>: R2 outranks R1 for A."
                ],
                [
                    "E7",
                    "On row <strong>C</strong>, untick <code>work</code>, press Enter.",
                    "A one-row rule for C: a copy of R1's tags without <code>work</code>. C is not orange. With reach <em>this transaction only</em> nothing else changes."
                ],
                [
                    "E8",
                    "On row <strong>A</strong>, untick <code>home</code>, tick <code>food</code>, press Enter.",
                    "R2 is updated in place. Still only A."
                ],
                [
                    "E9",
                    "On row <strong>A</strong>, untick everything, press Enter.",
                    "R2 becomes <em>add nothing</em>. A stays empty and is not orange."
                ],
                [
                    "E10",
                    "On row <strong>I1</strong>, tick <code>food</code>, press Enter, then Delete I1.",
                    "I1's one-row rule has no transaction left, so it is garbage collected."
                ],
                [
                    "E11",
                    "On row <strong>B</strong>, click the Alias cell, pick <em>Coffee</em>, press Enter. Then click row <strong>C</strong>.",
                    "C's inspector offers: a rule renames this text, extend to this transaction?"
                ],
                [
                    "E12",
                    "Click row <strong>B</strong>. On the Coffee rule's card choose <em>Add to R1</em>, then on R1's card Split <em>Description</em> out.",
                    "Adding the alias to R1 renames every row R1 covers. Splitting it back out keeps both rules on the same reach and changes no row."
                ],
                [
                    "E13",
                    "Open Automations, click New rule, Save.",
                    "Default reach is All; the count of rows that will change shows before Save."
                ],
                [
                    "E14",
                    "Set reach to <em>all matching</em> and automatic on. On row <strong>I2</strong>, tick <code>coffee</code>, press Enter, then click another row.",
                    "R1 itself gains <code>coffee</code>, and every row it governs gains it. A and C keep their own rules."
                ],
                [
                    "E15",
                    "Set reach to <em>from this date</em>, automatic on. On row <strong>I2</strong>, untick <code>work</code>, press Enter, click another row. Then import a row dated 20 Aug.",
                    "A from-10-Aug version of R1 without <code>work</code> takes over from I2 onward. The 20 Aug import gets <code>coffee</code> but not <code>work</code>; B keeps R1."
                ],
                [
                    "E16",
                    "Set reach to <em>all matching</em>, automatic off. On row <strong>B</strong>, tick <code>home</code>, press Enter, tick <em>Also replace N exceptions</em>, Apply now.",
                    "R1 gains <code>home</code> across its reach; the exceptions on A and C are deleted in the same action and their rows take R1's value."
                ]
            ];

            // ---------------------------------------------------------------------------------------------
            // Rendering
            // ---------------------------------------------------------------------------------------------
            // Garbage collection, as the maintenance pass would do it: an explicit-set rule with no surviving
            // ids, or a one-row exception whose output equals the wide rule that would otherwise govern its
            // row, has no possible effect and is deleted.
            function sameOutput(a, b) {
                return JSON.stringify(a) === JSON.stringify(b);
            }
            function gcRules() {
                const live = new Set(S.transactions.map((t) => t.id));
                const removed = [];
                S.rules = S.rules.filter((r) => {
                    if (r.reach.kind !== "ids") return true;
                    const ids = [...r.reach.ids].filter((id) => live.has(id));
                    if (ids.length === 0) {
                        removed.push(r.id);
                        return false;
                    }
                    const f = outputFields(r)[0];
                    if (
                        outputFields(r).length === 1 &&
                        !Object.values(S.pending).some((p) => p.ruleId === r.id)
                    ) {
                        const redundant = ids.every((id) => {
                            const t = S.transactions.find((x) => x.id === id);
                            const w = S.rules
                                .filter(
                                    (x) =>
                                        x !== r &&
                                        x.reach.kind !== "ids" &&
                                        x.outputs[f] != null &&
                                        governs(x, t)
                                )
                                .sort((p, q) => rank(q) - rank(p))[0];
                            return w != null && sameOutput(w.outputs[f], r.outputs[f]);
                        });
                        if (redundant) {
                            removed.push(r.id);
                            return false;
                        }
                    }
                    return true;
                });
                for (const id of removed) {
                    for (const [k, v] of Object.entries(S.pending))
                        if (v.ruleId === id) delete S.pending[k];
                    delete S.drafts[id];
                    if (S.selectedRule === id) S.selectedRule = null;
                }
                return removed;
            }
            const tagsOf = (id) => S.transactions.find((t) => t.id === id)?.tags ?? null;
            const idsRuleFor = (id, field = "tags") =>
                S.rules.find(
                    (r) => r.reach.kind === "ids" && r.reach.ids.has(id) && r.outputs[field] != null
                );
            const importedOn = (date) =>
                S.transactions.find((t) => t.id.startsWith("I") && t.date === date);
            const wideTagsRule = (kind) =>
                S.rules.find((r) => r.reach.kind === kind && r.outputs.tags);
            const DONE_WHEN = {
                E1: () => {
                    const r = idsRuleFor("B");
                    return r != null && r.outputs.tags.tags.includes("work");
                },
                E2: () => {
                    const r = idsRuleFor("A");
                    return r != null && r.outputs.tags.tags.includes("home");
                },
                E3: () => wideTagsRule("from") != null && (tagsOf("C") ?? []).includes("work"),
                E4: () => {
                    const t = importedOn("2026-06-01");
                    return t != null && t.tags.length === 0;
                },
                E5: () => {
                    const t = importedOn("2026-08-10");
                    return t != null && t.tags.includes("work");
                },
                E6: () =>
                    wideTagsRule("all") != null &&
                    (tagsOf("A") ?? []).includes("home") &&
                    !(tagsOf("A") ?? []).includes("work"),
                E7: () => {
                    const r = idsRuleFor("C");
                    const t = S.transactions.find((x) => x.id === "C");
                    return (
                        S.done.has("E6") &&
                        r != null &&
                        !r.outputs.tags.tags.includes("work") &&
                        t &&
                        !t.tags.includes("work") &&
                        agrees(r, t, "tags")
                    );
                },
                E8: () => {
                    const r = idsRuleFor("A");
                    return r != null && r.outputs.tags.tags.includes("food");
                },
                E9: () => {
                    const r = idsRuleFor("A");
                    return (
                        S.done.has("E8") &&
                        r != null &&
                        r.outputs.tags.tags.length === 0 &&
                        (tagsOf("A") ?? []).length === 0
                    );
                },
                E10: () => S.events.has("deletedImport") && importedOn("2026-06-01") == null,
                E11: () => S.events.has("offerC"),
                E12: () => S.events.has("split"),
                E13: () => S.events.has("pageCreate"),
                E14: () => {
                    const r = wideTagsRule("all");
                    return (
                        S.events.has("autoUpdate") &&
                        r != null &&
                        r.outputs.tags.tags.includes("coffee") &&
                        (tagsOf("B") ?? []).includes("coffee")
                    );
                },
                E15: () => {
                    const t = importedOn("2026-08-20");
                    return (
                        S.events.has("autoFrom") &&
                        t != null &&
                        t.tags.includes("coffee") &&
                        !t.tags.includes("work") &&
                        (tagsOf("B") ?? []).includes("work")
                    );
                },
                E16: () => S.events.has("override")
            };
            function checkDone() {
                for (const [id, test] of Object.entries(DONE_WHEN)) {
                    try {
                        if (!S.done.has(id) && test()) S.done.add(id);
                    } catch (e) {
                        /* partial state */
                    }
                }
            }

            function render() {
                gcRules();
                checkDone();
                document
                    .querySelectorAll("#tabs [data-view]")
                    .forEach((b) =>
                        b.setAttribute("aria-current", String(b.dataset.view === S.view))
                    );
                const main = document.getElementById("main");
                main.className = S.view === "automations" ? "page" : "";
                main.innerHTML =
                    renderChecklist() +
                    (S.view === "automations"
                        ? renderAutomations()
                        : renderTable() + renderInspector());
                S.changed = new Set();
                const focusEl = document.querySelector("[data-autofocus]");
                if (focusEl) focusEl.focus();
            }
            function renderChecklist() {
                return h`<section class="checklist" aria-label="Worked examples">
    <span class="eyebrow">Remembered for new rules</span>
    <label class="small">Reach <select data-pref-reach><option value="ids" ${S.prefs.reach === "ids" ? "selected" : ""}>this transaction only</option><option value="from" ${S.prefs.reach === "from" ? "selected" : ""}>from this transaction's date</option><option value="all" ${S.prefs.reach === "all" ? "selected" : ""}>all matching</option></select></label>
    <label class="check small"><input type="checkbox" data-pref-auto ${S.prefs.autoApply ? "checked" : ""}><span>Apply automatically when I leave the row</span></label>
    <span class="eyebrow">Worked examples from the spec</span>
    <ol>${CHECKLIST.map(([id, step, expect]) => h`<li class="${S.done.has(id) ? "done" : ""}"><strong>${id}.</strong> ${step}<span class="hint">${expect}</span></li>`).join("")}</ol>
    <span class="eyebrow">Legend</span>
    <p class="small"><span class="dot own"></span> a one-row rule sets this value &nbsp; <span class="dot"></span> a wider rule sets it &nbsp; <span class="dot warn"></span> governed but differs</p>
    <p class="small muted">Steps tick themselves as the state shows them done.</p><div class="btns"><button type="button" class="btn sm" data-act="mark" data-id="">Tick the next step manually</button></div>
  </section>`;
            }
            function renderTable() {
                const rows = S.transactions
                    .map((t) => {
                        const cls = [
                            t.id === S.activeRow ? "active" : "",
                            S.changed.has(t.id) ? "changed" : ""
                        ].join(" ");
                        const dot = (f) => {
                            const w = winner(S.rules, t, f);
                            if (!w) return "";
                            const bad = !agrees(w, t, f);
                            return h`<span class="dot ${bad ? "warn" : w.reach.kind === "ids" ? "own" : ""}" title="${esc((bad ? "Governed by " : "Set by ") + w.id + " · " + condLabel(w) + " · " + reachLabel(w, S.transactions))}"></span>`;
                        };
                        const ed = S.editing && S.editing.id === t.id ? S.editing.field : null;
                        const cell = (f, content) =>
                            h`<td class="cell ${ed === f ? "editing" : ""}" data-edit="${f}" data-row="${t.id}">${ed === f ? renderInlineEditor(t, f) : content + dot(f)}</td>`;
                        return h`<tr class="${cls}" data-row="${t.id}">
      <td class="mono"><strong>${t.id}</strong></td><td>${fmtDate(t.date)}</td><td class="mono">${esc(t.text)}</td>
      ${cell("alias", esc(t.alias ?? ""))}
      <td class="num">${money(t.amount)}</td><td>${ACCOUNTS[t.account]}</td>
      ${cell("tags", t.tags.map((x) => h`<span class="tag">${esc(x)}</span>`).join(""))}
      ${cell("alloc", PEOPLE.map((p) => (t.alloc[p] == null ? "—" : t.alloc[p] + "%")).join(" / "))}
      <td><button class="btn sm danger" type="button" data-act="delete-tx" data-id="${t.id}" aria-label="Delete transaction ${t.id}">Delete</button></td>
    </tr>`;
                    })
                    .join("");
                return h`<div class="table-wrap">
    <table><thead><tr><th title="Mock only: the name the steps use">Row</th><th>Date</th><th>Description</th><th>Alias</th><th>Amount</th><th>Account</th><th>Tags</th><th>Alex / Sam</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="table-foot"><span class="muted">Import a COFFEE SHOP 123 row dated</span>
      <input type="date" id="import-date" value="${S.importDate}" aria-label="Import date">
      <button class="btn sm" type="button" data-act="import">Import</button>
      <span class="muted">Rules govern imports only within their reach.</span></div>
  </div>`;
            }
            function renderInlineEditor(t, f) {
                const d = S.editing.draft;
                if (f === "alias")
                    return h`<span class="inline-edit"><select data-ed="alias" data-autofocus aria-label="Alias"><option value="">(none)</option>${ALIASES.map((a) => h`<option ${d === a ? "selected" : ""}>${a}</option>`).join("")}</select><button class="btn sm" type="button" data-act="commit">Enter</button><button class="btn sm" type="button" data-act="cancel-edit">Esc</button></span>`;
                if (f === "tags")
                    return h`<span class="inline-edit">${TAGS.map((tag, i) => h`<label class="check"><input type="checkbox" data-ed="tag" value="${tag}" ${d.tags.includes(tag) ? "checked" : ""} ${i === 0 ? "data-autofocus" : ""}><span>#${tag}</span></label>`).join("")}<button class="btn sm" type="button" data-act="commit">Enter</button><button class="btn sm" type="button" data-act="cancel-edit">Esc</button></span>`;
                return h`<span class="inline-edit">${PEOPLE.map((p, i) => h`<label class="small">${p} <input type="number" data-ed="alloc" data-person="${p}" value="${d[p] ?? ""}" placeholder="—" ${i === 0 ? "data-autofocus" : ""}></label>`).join("")}<button class="btn sm" type="button" data-act="commit">Enter</button><button class="btn sm" type="button" data-act="cancel-edit">Esc</button></span>`;
            }

            // The default that will run when the row changes (or Apply is pressed) for a one-row rule.
            // The wide rule (not the one-row rule) that governs this field on the row, if any.
            function governingWide(r, t) {
                const f = outputFields(r)[0];
                return (
                    S.rules
                        .filter(
                            (x) =>
                                x.id !== r.id &&
                                x.reach.kind !== "ids" &&
                                x.outputs[f] != null &&
                                governs(x, t)
                        )
                        .sort((a, b) => rank(b) - rank(a))[0] ?? null
                );
            }
            // The edit applied to a rule's output: tags keep the rule's mode and gain/lose what the user
            // added/removed; alias and allocation take the new value.
            function transformOutput(field, base, edit) {
                if (field !== "tags") return edit.value;
                if (base == null) return { mode: "add", tags: [...edit.value.tags] };
                const tags = base.tags.filter((x) => !edit.removed.includes(x));
                for (const x of edit.added) if (!tags.includes(x)) tags.push(x);
                return { mode: base.mode, tags };
            }
            // What the chosen reach does for a one-row rule created or updated by an edit on row t.
            function defaultActionFor(r, t, choice = S.pending[r.id]?.choice ?? S.prefs.reach) {
                if (choice === "ids") return null;
                const g = governingWide(r, t);
                if (choice === "all")
                    return g
                        ? { kind: "update", host: g }
                        : { kind: "widen", reach: { kind: "all" } };
                return { kind: "widen", reach: { kind: "from", date: t.date }, over: g };
            }
            function coveredExceptions(rule, reach, f, excludeId) {
                const probe = { ...rule, reach };
                const rows = S.transactions.filter((t) => governs(probe, t));
                const exceptions = S.rules.filter(
                    (x) =>
                        x.id !== excludeId &&
                        x.id !== rule.id &&
                        x.reach.kind === "ids" &&
                        x.outputs[f] != null &&
                        sameConds(x, rule) &&
                        rows.some((t) => x.reach.ids.has(t.id)) &&
                        !sameOutput(x.outputs[f], rule.outputs[f])
                );
                const narrower = S.rules.filter(
                    (x) =>
                        x.id !== rule.id &&
                        x.reach.kind !== "ids" &&
                        x.outputs[f] != null &&
                        x.text === rule.text &&
                        !sameConds(x, rule) &&
                        condRank(x) > condRank(rule) &&
                        rows.some((t) => governs(x, t))
                );
                return { exceptions, narrower };
            }
            function overrideLine(cov) {
                const n = cov.exceptions.length,
                    m = cov.narrower.length;
                if (!n && !m) return "";
                return h`${n ? h`<label class="check"><input type="checkbox" data-override ${S.override ? "checked" : ""}><span>Also replace ${n} exception${n === 1 ? "" : "s"} on these rows<span class="hint">Deletes those one-row rules in the same action; undo reverts everything.</span></span></label>` : ""}${m ? h`<p class="small muted">${m} more specific rule${m === 1 ? "" : "s"} keep their rows.</p>` : ""}`;
            }
            function dropCoveredExceptions(rule, reach, f, excludeId) {
                if (!S.override) return 0;
                S.events.add("override");
                const cov = coveredExceptions(rule, reach, f, excludeId);
                S.rules = S.rules.filter((x) => !cov.exceptions.includes(x));
                for (const x of cov.exceptions) {
                    for (const [k, v] of Object.entries(S.pending))
                        if (v.ruleId === x.id) delete S.pending[k];
                    delete S.drafts[x.id];
                }
                S.override = false;
                return cov.exceptions.length;
            }
            function actionLabel(r, a) {
                const f = outputFields(r)[0];
                const pend = Object.values(S.pending).find((p) => p.ruleId === r.id);
                const plural = (n) => n + " transaction" + (n === 1 ? "" : "s") + " change";
                if (a.kind === "update") {
                    const out = pend
                        ? transformOutput(f, a.host.outputs[f], pend.edit)
                        : r.outputs[f];
                    return (
                        "Edit " +
                        a.host.id +
                        " · " +
                        plural(
                            rowsChangedBy(
                                { ...a.host, outputs: { ...a.host.outputs, [f]: out } },
                                a.host.reach,
                                f,
                                pend?.edit,
                                r.id
                            ).length
                        )
                    );
                }
                const n = rowsChangedBy(r, a.reach, f, pend?.edit, null).length;
                return (
                    (a.reach.kind === "all"
                        ? "All matching"
                        : "From " +
                          fmtDate(a.reach.date) +
                          " onward" +
                          (a.over ? " · " + a.over.id + " keeps earlier rows" : "")) +
                    " · " +
                    plural(n)
                );
            }
            // Rows the rule would govern and win under a reach whose value would actually change,
            // propagating the edit (removed tags come off as well).
            function rowsChangedBy(rule, reach, f, edit, dropId) {
                const probe = { ...rule, reach };
                const rules = [
                    ...S.rules.filter((x) => x.id !== rule.id && x.id !== dropId),
                    probe
                ];
                return S.transactions.filter(
                    (t) =>
                        winner(rules, t, f) === probe &&
                        (!agrees(probe, t, f) ||
                            (f === "tags" && edit && edit.removed.some((x) => t.tags.includes(x))))
                );
            }
            function applyEdit(t, f, out, edit) {
                let n = applyOutput(t, f, out);
                if (f === "tags" && edit)
                    n = {
                        ...n,
                        tags: n.tags.filter(
                            (x) => !edit.removed.includes(x) || out.tags.includes(x)
                        )
                    };
                return n;
            }
            function runAction(r, a) {
                const f = outputFields(r)[0];
                const pend = Object.values(S.pending).find((p) => p.ruleId === r.id) ?? {
                    edit: null
                };
                const edit = pend.edit;
                for (const [k, v] of Object.entries(S.pending))
                    if (v.ruleId === r.id) delete S.pending[k];
                if (a.kind === "update") {
                    const host = a.host;
                    const out = edit ? transformOutput(f, host.outputs[f], edit) : r.outputs[f];
                    dropCoveredExceptions(
                        { ...host, outputs: { ...host.outputs, [f]: out } },
                        host.reach,
                        f,
                        r.id
                    );
                    S.rules = S.rules.filter((x) => x !== r);
                    delete S.drafts[r.id];
                    const before = { ...host, outputs: { ...host.outputs } };
                    if (f === "tags" && out.tags.length === 0 && out.mode === "add")
                        delete host.outputs[f];
                    else host.outputs[f] = out;
                    if (outputFields(host).length === 0)
                        S.rules = S.rules.filter((x) => x !== host);
                    const changed = rowsChangedBy(
                        { ...before, outputs: { ...before.outputs, [f]: out } },
                        host.reach,
                        f,
                        edit,
                        null
                    );
                    for (const t of changed) setRow(t.id, (x) => applyEdit(x, f, out, edit));
                    S.events.add("autoUpdate");
                    toast(
                        "Edited " +
                            host.id +
                            ": " +
                            changed.length +
                            " transaction" +
                            (changed.length === 1 ? "" : "s") +
                            " changed; the one-row rule folded in."
                    );
                    return;
                }
                const holder = collision(S.rules, { ...r, reach: a.reach }, f, r.id);
                if (holder) {
                    pend.edit = edit;
                    return runAction(r, { kind: "update", host: holder });
                }
                dropCoveredExceptions(r, a.reach, f, null);
                const changed = rowsChangedBy(r, a.reach, f, edit, null);
                r.reach = cloneReach(a.reach);
                delete S.drafts[r.id];
                for (const t of changed) setRow(t.id, (x) => applyEdit(x, f, r.outputs[f], edit));
                S.events.add(a.reach.kind === "from" ? "autoFrom" : "autoWiden");
                toast(
                    "Saved " +
                        r.id +
                        ": now " +
                        reachLabel(r, S.transactions) +
                        "; " +
                        changed.length +
                        " transaction" +
                        (changed.length === 1 ? "" : "s") +
                        " changed."
                );
            }
            // Called whenever the active row changes away from `rowId`.
            // Called whenever the active row changes away from `rowId`.
            function leaveRow(rowId) {
                S.override = false;
                for (const [key, pend] of Object.entries(S.pending)) {
                    if (pend.rowId !== rowId) continue;
                    const r = ruleById(pend.ruleId);
                    if (!r || pend.choice === "ids") {
                        delete S.pending[key];
                        continue;
                    }
                    if (!S.prefs.autoApply) continue;
                    const t = S.transactions.find((x) => x.id === rowId);
                    const a = t ? defaultActionFor(r, t, pend.choice) : null;
                    if (a) runAction(r, a);
                    else delete S.pending[key];
                }
            }

            // What committing the current draft would do. Pure.
            function previewForEdit(t, field, draft) {
                const plan = planEdit(t, field, draft);
                if (plan.kind === "none")
                    return { text: "Clears the value. No rule governs it, so no rule is needed." };
                const probe = plan.own
                    ? { ...plan.own, outputs: { [field]: plan.output } }
                    : mkRule({
                          id: "?",
                          outputs: { [field]: plan.output },
                          reach: { kind: "ids", ids: new Set([t.id]) }
                      });
                const first =
                    (plan.own
                        ? "Updates this transaction's rule " + plan.own.id
                        : "Creates a rule for this transaction") +
                    " (" +
                    valueLabel(field, plan.output) +
                    ")";
                const a = defaultActionFor(probe, t, S.prefs.reach);
                if (!a) return { text: first + ". Nothing else changes." };
                const label =
                    a.kind === "update"
                        ? "edits " + a.host.id
                        : a.reach.kind === "all"
                          ? "widens to all matching"
                          : "takes over from " + fmtDate(t.date) + " onward";
                return {
                    text:
                        first +
                        "; " +
                        (S.prefs.autoApply
                            ? "when you leave the row it "
                            : "the card offers: it ") +
                        label +
                        "."
                };
            }
            // Plan an edit on row t: the one-row rule's new output is the edit applied to the rule that
            // governed the field, or the plain new value when none did.
            function planEdit(t, field, draft) {
                const value =
                    field === "alias"
                        ? draft || ""
                        : field === "tags"
                          ? { mode: "add", tags: [...draft.tags] }
                          : { ...draft };
                const added = field === "tags" ? value.tags.filter((x) => !t.tags.includes(x)) : [];
                const removed =
                    field === "tags" ? t.tags.filter((x) => !value.tags.includes(x)) : [];
                const edit = { value, added, removed };
                const own = S.rules.find(
                    (r) =>
                        r.outputs[field] != null &&
                        r.reach.kind === "ids" &&
                        r.reach.ids.has(t.id) &&
                        matches(r, t)
                );
                const base = winner(S.rules, t, field);
                const cleared =
                    field === "alias"
                        ? value === ""
                        : field === "tags"
                          ? value.tags.length === 0
                          : PEOPLE.every((p) => value[p] == null);
                if (!base && cleared) return { kind: "none", edit };
                return {
                    kind: "rule",
                    own,
                    base,
                    edit,
                    output: transformOutput(field, base?.outputs[field], edit)
                };
            }
            function renderInspector() {
                const t = activeTx();
                if (!t)
                    return h`<aside><div class="head"><h2>Transaction inspector</h2></div><div class="body"><p class="muted small">Select a row.</p></div></aside>`;
                const parts = [];
                if (S.editing && S.editing.id === t.id) {
                    const p = previewForEdit(t, S.editing.field, S.editing.draft);
                    parts.push(
                        h`<div class="card preview"><span class="eyebrow">While you edit</span><p><strong>${esc(p.text)}</strong></p><p class="small muted">Press Enter to finish. Nothing is written until then.</p></div>`
                    );
                }
                const governing = S.rules
                    .filter((r) => outputFields(r).some((f) => winner(S.rules, t, f) === r))
                    .sort((a, b) => rank(b) - rank(a) || a.id.localeCompare(b.id));
                for (const r of governing) parts.push(renderRuleCard(r, t));
                // Offers: same-text rules that do not reach this row, only for fields nothing governs here.
                const ungoverned = FIELDS.filter((f) => winner(S.rules, t, f) == null);
                const offers = S.rules.filter(
                    (r) =>
                        matches(r, t) &&
                        !reaches(r, t) &&
                        outputFields(r).some((f) => ungoverned.includes(f))
                );
                if (offers.length) parts.push(renderExtendOffers(offers, t));
                if (!parts.length)
                    parts.push(
                        h`<p class="muted small">No rule governs this transaction. Edit a cell to create one.</p>`
                    );
                return h`<aside aria-labelledby="insp-title"><div class="head"><div><h2 id="insp-title">Transaction inspector</h2><p class="muted small">${esc(t.text)} · ${fmtDate(t.date)} · ${money(t.amount)} · ${ACCOUNTS[t.account]}</p></div></div>
    <div class="body"><div class="group"><h3>Automation</h3>${parts.join("")}</div></div></aside>`;
            }
            function draftFor(r) {
                if (!S.drafts[r.id]) S.drafts[r.id] = { reach: cloneReach(r.reach) };
                return S.drafts[r.id];
            }
            function cloneReach(x) {
                return x.kind === "ids" ? { kind: "ids", ids: new Set(x.ids) } : { ...x };
            }
            function renderReachControl(r, d, t) {
                const idsCount = governedBy(
                    {
                        ...r,
                        reach: {
                            kind: "ids",
                            ids:
                                r.reach.kind === "ids"
                                    ? r.reach.ids
                                    : new Set(governedBy(r, S.transactions).map((x) => x.id))
                        }
                    },
                    S.transactions
                ).length;
                const fromDate =
                    d.reach.kind === "from"
                        ? d.reach.date
                        : t
                          ? t.date
                          : (governedBy(r, S.transactions)[0]?.date ?? "2026-07-01");
                const n = (reach) => {
                    const f = outputFields(r)[0];
                    return populationUnder(r, reach, S.transactions, f).length;
                };
                const nFrom = n({ kind: "from", date: fromDate }),
                    nAll = n({ kind: "all" });
                return h`<div class="group" role="radiogroup" aria-label="Where this rule applies"><span class="eyebrow">Applies to</span>
    <label class="radio"><input type="radio" name="reach-${r.id}" value="ids" data-reach ${d.reach.kind === "ids" ? "checked" : ""}><span>Only the transactions it was applied to<span class="hint">${idsCount} transaction${idsCount === 1 ? "" : "s"}. Nothing else changes.</span></span></label>
    <label class="radio"><input type="radio" name="reach-${r.id}" value="from" data-reach ${d.reach.kind === "from" ? "checked" : ""}><span>Matching transactions from <input type="date" value="${fromDate}" data-reach-date aria-label="From date"> onward<span class="hint">${nFrom} would change now; future imports with such dates are governed.</span></span></label>
    <label class="radio"><input type="radio" name="reach-${r.id}" value="all" data-reach ${d.reach.kind === "all" ? "checked" : ""}><span>All matching transactions<span class="hint">${nAll} would change now, past and future.</span></span></label>
    ${d.reach.kind !== "ids" && (r.reach.kind === "ids" || d.reach.kind !== r.reach.kind || (d.reach.kind === "from" && d.reach.date !== r.reach.date)) ? overrideLine(coveredExceptions(r, d.reach, outputFields(r)[0], null)) : ""}</div>`;
            }
            function renderRuleCard(r, t) {
                const d = draftFor(r);
                const badges = outputFields(r)
                    .map((f) => {
                        const bad = t && winner(S.rules, t, f) === r && !agrees(r, t, f);
                        return h`<div class="badge ${bad ? "warn" : ""}"><div class="row1"><span class="field">${fieldLabel(f)}</span><span class="value">${esc(valueLabel(f, r.outputs[f]))}</span>
      <span class="btns">${outputFields(r).length > 1 ? h`<button class="btn sm" type="button" data-act="split" data-rule="${r.id}" data-field="${f}">Split</button>` : ""}</span></div>
      ${
          bad
              ? h`<div class="diff"><span class="chip warn">differs on this transaction</span><span>Rule: ${esc(valueLabel(f, r.outputs[f]))}</span><span class="bad">This transaction: ${esc(rowValueLabel(f, t))}</span>
        <button class="btn sm" type="button" data-act="apply-this" data-rule="${r.id}">${r.reach.kind === "ids" ? "Reapply" : "Apply to this transaction"}</button></div>
        ${r.reach.kind === "ids" ? h`<p class="small muted">You set this on ${esc(fmtDate(t.date))} and changed it by hand since. Reapply, or delete the rule to keep the change.</p>` : ""}`
              : ""
      }</div>`;
                    })
                    .join("");
                // Fold offer: this is a one-row rule and a wider identical-conditions rule also governs the row.
                const pend = Object.values(S.pending).find((p) => p.ruleId === r.id);
                let fold = "";
                if (t && r.reach.kind === "ids" && !pend) {
                    const sameSet = (x) =>
                        x.reach.kind === "ids" &&
                        x.reach.ids.size === r.reach.ids.size &&
                        [...r.reach.ids].every((id) => x.reach.ids.has(id));
                    const hosts = S.rules.filter(
                        (x) =>
                            x.id !== r.id &&
                            sameConds(x, r) &&
                            governs(x, t) &&
                            (x.reach.kind !== "ids" || sameSet(x))
                    );
                    const f = outputFields(r)[0];
                    const owner = hosts.find((x) => x.outputs[f] != null),
                        host = hosts.find((x) => x.outputs[f] == null);
                    const target = owner ?? host;
                    if (target) {
                        const count = populationUnder(
                            { ...target, outputs: { ...target.outputs, [f]: r.outputs[f] } },
                            target.reach,
                            S.transactions,
                            f
                        ).length;
                        fold = h`<div class="panel"><p><strong>${owner ? (owner.reach.kind === "ids" ? "Rule " + owner.id + " also sets this for the same transactions" : "This is an exception to " + owner.id) : host.reach.kind === "ids" ? "Rule " + host.id + " applies to the same transactions" : "Rule " + host.id + " also governs this transaction"}.</strong></p>
        <p class="small">${owner ? "Fold this change into " + owner.id + " instead: " + count + " transaction" + (count === 1 ? "" : "s") + " change and this exception is deleted." : "Add " + fieldLabel(f).toLowerCase() + " to " + host.id + ": " + count + " transaction" + (count === 1 ? "" : "s") + " change and this one-row rule is deleted."}</p>
        <div class="chips"><button class="btn sm primary" type="button" data-act="fold" data-rule="${r.id}" data-host="${target.id}">${owner ? "Fold into " + owner.id : host.reach.kind === "ids" ? "Combine with " + host.id : "Add to " + host.id}</button><span class="chip own">keeping it as is changes nothing</span></div></div>`;
                    }
                }
                return h`<div class="card" data-rule="${r.id}" role="group" aria-label="Rule ${r.id}">
    <div class="title"><h3>Rule ${r.id}</h3><span class="target">${esc(condLabel(r))}</span><span class="chip ${r.reach.kind === "ids" ? "own" : "ok"}">${esc(reachLabel(r, S.transactions))}</span></div>
    ${pend ? renderPendingPanel(r, t, pend) : fold}
    <div class="group"><span class="eyebrow">Outputs</span>${badges}</div>
    ${pend ? "" : renderReachControl(r, d, t)}
    <div class="actions">${pend ? h`<button class="btn primary" type="button" data-act="apply-now" data-rule="${r.id}" ${pend.choice === "ids" ? "disabled" : ""}>Apply now</button>` : h`<button class="btn primary" type="button" data-act="save" data-rule="${r.id}">Save</button><button class="btn" type="button" data-act="cancel" data-rule="${r.id}">Cancel</button>`}<span class="spacer"></span><button class="btn danger" type="button" data-act="delete-rule" data-rule="${r.id}">Delete rule</button></div>
  </div>`;
            }
            function renderPendingPanel(r, t, pend) {
                const f = outputFields(r)[0];
                const g = governingWide(r, t);
                const opt = (value, label) =>
                    h`<label class="radio"><input type="radio" name="pend-${r.id}" value="${value}" data-pend-choice ${pend.choice === value ? "checked" : ""}><span>${label}</span></label>`;
                const fromA = defaultActionFor(r, t, "from"),
                    allA = defaultActionFor(r, t, "all");
                const cov =
                    pend.choice === "ids"
                        ? null
                        : pend.choice === "all" && allA.kind === "update"
                          ? coveredExceptions(
                                {
                                    ...g,
                                    outputs: {
                                        ...g.outputs,
                                        [f]: transformOutput(f, g.outputs[f], pend.edit)
                                    }
                                },
                                g.reach,
                                f,
                                r.id
                            )
                          : coveredExceptions(
                                r,
                                pend.choice === "all"
                                    ? { kind: "all" }
                                    : { kind: "from", date: t.date },
                                f,
                                null
                            );
                return h`<div class="panel" role="group" aria-label="When you leave this row"><span class="eyebrow">${S.prefs.autoApply ? "When you leave this row" : "Waiting for Apply"}</span>
    ${opt("ids", "Only this transaction · nothing else changes")}
    ${opt("from", actionLabel(r, fromA))}
    ${opt("all", actionLabel(r, allA))}
    ${cov ? overrideLine(cov) : ""}
    <label class="check"><input type="checkbox" data-pref-auto ${S.prefs.autoApply ? "checked" : ""}><span>Apply automatically when I leave the row<span class="hint">Remembered, as is the reach. Entering the inspector does not count as leaving. Only rows whose values would change are written.</span></span></label>
  </div>`;
            }

            function renderExtendOffers(rules, t) {
                if (t.id === "C" && rules.some((r) => r.outputs.alias)) S.events.add("offerC");
                const items = rules
                    .map((r) => {
                        const older = r.reach.kind === "from" && t.date < r.reach.date;
                        return h`<div class="badge"><div class="row1"><span class="field">Rule ${r.id}</span><span class="value">${esc(
                            outputFields(r)
                                .map((f) => valueLabel(f, r.outputs[f]))
                                .join(", ")
                        )}</span><span class="chip">${esc(reachLabel(r, S.transactions))}</span></div>
      <div class="chips"><button class="btn sm primary" type="button" data-act="extend" data-rule="${r.id}">Extend to this transaction</button>${older ? h`<button class="btn sm" type="button" data-act="widen-all" data-rule="${r.id}">Widen to all matching</button>` : ""}</div></div>`;
                    })
                    .join("");
                return h`<div class="card offer"><div class="title"><h3>Other rules for this text</h3><span class="target">${rules.length} rule${rules.length === 1 ? "" : "s"} match this description but do not reach this transaction.</span></div>${items}</div>`;
            }
            function renderAutomations() {
                const groups = [
                    ["all", "Applied to everything"],
                    ["from", "Applied from a date"],
                    ["ids", "Applied to specific transactions"]
                ];
                const list = groups
                    .map(([k, label]) => {
                        const rs = S.rules.filter((r) => r.reach.kind === k);
                        return h`<details ${k === "ids" ? "" : "open"}><summary>${label} <span class="muted">(${rs.length})</span></summary>
      ${rs.map((r) => h`<button class="rule" type="button" data-select-rule="${r.id}" aria-current="${r.id === S.selectedRule}">${esc(r.id + " · " + condLabel(r))}<span class="sub">${outputFields(r).map(fieldLabel).join(" · ")} · ${esc(reachLabel(r, S.transactions))}</span></button>`).join("") || '<p class="small muted" style="margin:6px 0 2px">None.</p>'}</details>`;
                    })
                    .join("");
                const r = ruleById(S.selectedRule);
                const editor = r ? renderRuleCard(r, null) : renderNewRuleEditor();
                return h`<section class="rules" aria-label="Automations"><div style="display:flex;gap:8px;align-items:center"><h2 style="flex:1">Automations</h2><button class="btn sm" type="button" data-act="new-rule">New rule</button></div>${list}<p class="small muted">Rules run on import only within their reach.</p></section>
    <section class="rules" aria-label="Rule editor">${editor}</section>`;
            }
            function renderNewRuleEditor() {
                const d = (S.drafts.__new ??= {
                    text: "BOOKSTORE 99",
                    account: null,
                    tags: ["food"],
                    reach: { kind: "all" }
                });
                const probe = mkRule({
                    id: "new",
                    text: d.text,
                    account: d.account,
                    outputs: { tags: { mode: "add", tags: d.tags } },
                    reach: d.reach
                });
                const n = populationUnder(probe, d.reach, S.transactions, "tags").length;
                return h`<div class="card"><div class="title"><h3>New rule</h3></div>
    <div class="group cond"><span class="eyebrow">Matches</span><input type="text" value="${esc(d.text)}" data-new="text" aria-label="Exact description text"><select data-new="account" aria-label="Account"><option value="">Any account</option>${Object.entries(
        ACCOUNTS
    )
        .map(([k, v]) => h`<option value="${k}" ${d.account === k ? "selected" : ""}>${v}</option>`)
        .join("")}</select></div>
    <div class="group"><span class="eyebrow">Outputs</span><div class="badge"><div class="row1"><span class="field">Tags</span><span class="value">${esc(valueLabel("tags", { mode: "add", tags: d.tags }))}</span></div><div class="chips">${TAGS.map((tag) => h`<label class="check"><input type="checkbox" data-new="tag" value="${tag}" ${d.tags.includes(tag) ? "checked" : ""}><span>#${tag}</span></label>`).join("")}</div></div></div>
    ${renderReachControl(probe, { reach: d.reach }, null)}
    <p class="small muted">${n} transaction${n === 1 ? "" : "s"} would change on Save.</p>
    <div class="actions"><button class="btn primary" type="button" data-act="create-rule">Save</button><button class="btn" type="button" data-act="cancel-new">Cancel</button></div></div>`;
            }

            // ---------------------------------------------------------------------------------------------
            // Mutations (one "vault action" each)
            // ---------------------------------------------------------------------------------------------
            function setRow(id, fn) {
                S.transactions = S.transactions.map((t) => (t.id === id ? fn(t) : t));
                S.changed.add(id);
            }
            function commitEdit() {
                const { id, field, draft } = S.editing;
                const t = S.transactions.find((x) => x.id === id);
                const plan = planEdit(t, field, draft);
                setRow(id, (x) => {
                    const n = { ...x, tags: [...x.tags], alloc: { ...x.alloc } };
                    if (field === "alias") n.alias = plan.edit.value || null;
                    if (field === "tags") n.tags = [...plan.edit.value.tags];
                    if (field === "alloc") n.alloc = { ...plan.edit.value };
                    return n;
                });
                if (plan.kind === "none") {
                    toast("Value cleared. No rule governed it, so no rule is needed.");
                    S.editing = null;
                    return render();
                }
                let r = plan.own;
                if (r) r.outputs[field] = plan.output;
                else {
                    r = mkRule({
                        outputs: { [field]: plan.output },
                        reach: { kind: "ids", ids: new Set([id]) }
                    });
                    S.rules.push(r);
                }
                S.pending["p" + r.id] = {
                    ruleId: r.id,
                    rowId: id,
                    choice: S.prefs.reach,
                    edit: plan.edit
                };
                const a = defaultActionFor(r, t, S.prefs.reach);
                toast(
                    (plan.own ? "Updated " : "Created rule ") +
                        r.id +
                        " for this transaction (" +
                        valueLabel(field, plan.output) +
                        ")" +
                        (a
                            ? (S.prefs.autoApply
                                  ? "; when you leave the row: "
                                  : "; the card offers: ") + actionLabel(r, a).toLowerCase()
                            : "") +
                        "."
                );
                S.editing = null;
                render();
            }
            function saveReach(r, quiet = false) {
                if (quiet) S.events.add("autoWiden");
                const d = draftFor(r);
                const field = outputFields(r)[0];
                if (d.reach.kind === "ids" && r.reach.kind !== "ids")
                    d.reach = {
                        kind: "ids",
                        ids: new Set(governedBy(r, S.transactions).map((t) => t.id))
                    };
                const probe = { ...r, reach: d.reach };
                // Widening into an occupied wide slot folds into that rule rather than colliding.
                if (r.reach.kind === "ids" && d.reach.kind !== "ids") {
                    const w = S.rules.find(
                        (x) =>
                            x.id !== r.id &&
                            x.reach.kind !== "ids" &&
                            sameConds(x, r) &&
                            x.outputs[field] != null
                    );
                    if (w) {
                        delete S.drafts[r.id];
                        return fold(r, w, quiet);
                    }
                }
                dropCoveredExceptions(r, d.reach, field, null);
                for (const f of outputFields(r)) {
                    const c = collision(S.rules, probe, f, r.id);
                    if (c) {
                        toast(
                            "Refused: " +
                                c.id +
                                " already holds " +
                                fieldLabel(f).toLowerCase() +
                                " for " +
                                condLabel(c) +
                                " at that reach. Open " +
                                c.id +
                                " to change it."
                        );
                        return;
                    }
                }
                const before = S.rules;
                const newly = S.transactions.filter((t) => governs(probe, t) && !governs(r, t));
                r.reach = d.reach;
                delete S.drafts[r.id];
                for (const [k, v] of Object.entries(S.pending))
                    if (v.ruleId === r.id) delete S.pending[k];
                const changed = newly.filter((t) =>
                    outputFields(r).some((f) => winner(S.rules, t, f) === r && !agrees(r, t, f))
                );
                for (const t of changed) setRow(t.id, (x) => applyWinning(r, x));
                toast(
                    "Saved " +
                        r.id +
                        ": now " +
                        reachLabel(r, S.transactions) +
                        (changed.length
                            ? "; " +
                              changed.length +
                              " transaction" +
                              (changed.length === 1 ? "" : "s") +
                              " changed."
                            : "; no transaction needed to change.")
                );
                if (!quiet) render();
            }
            function fold(oneRow, host, quiet = false) {
                if (quiet) S.events.add("autoUpdate");
                const f = outputFields(oneRow)[0];
                host.outputs[f] = oneRow.outputs[f];
                S.rules = S.rules.filter((r) => r !== oneRow);
                delete S.drafts[oneRow.id];
                for (const [k, v] of Object.entries(S.pending))
                    if (v.ruleId === oneRow.id) delete S.pending[k];
                const pop = governedBy(host, S.transactions).filter(
                    (t) => winner(S.rules, t, f) === host && !agrees(host, t, f)
                );
                for (const t of pop) setRow(t.id, (x) => applyOutput(x, f, host.outputs[f]));
                toast(
                    "Updated " +
                        host.id +
                        ": " +
                        pop.length +
                        " transaction" +
                        (pop.length === 1 ? "" : "s") +
                        " changed; " +
                        oneRow.id +
                        " folded in."
                );
                if (!quiet) render();
            }
            function extend(r, t) {
                if (r.reach.kind !== "ids") {
                    toast("Only an explicit-set rule can be extended one transaction at a time.");
                    return;
                }
                r.reach.ids.add(t.id);
                setRow(t.id, (x) => applyWinning(r, x));
                toast("Extended " + r.id + " to this transaction.");
                render();
            }
            function importRow(date) {
                S.importCount = (S.importCount ?? 0) + 1;
                const id = "I" + S.importCount;
                let t = tx(id, date, "A", -450);
                const applied = [];
                for (const f of FIELDS) {
                    const w = winner(S.rules, t, f);
                    if (w) {
                        t = applyOutput(t, f, w.outputs[f]);
                        applied.push(w.id);
                    }
                }
                leaveRow(S.activeRow);
                S.transactions = [...S.transactions, t].sort((a, b) =>
                    a.date.localeCompare(b.date)
                );
                S.changed.add(id);
                S.activeRow = id;
                toast(
                    applied.length
                        ? "Imported " +
                              id +
                              "; governed on arrival by " +
                              [...new Set(applied)].join(", ") +
                              "."
                        : "Imported " + id + "; no rule reaches it."
                );
                render();
            }
            function deleteTx(id) {
                if (id.startsWith("I")) S.events.add("deletedImport");
                S.transactions = S.transactions.filter((t) => t.id !== id);
                const emptied = [];
                for (const r of S.rules)
                    if (r.reach.kind === "ids" && r.reach.ids.delete(id) && r.reach.ids.size === 0)
                        emptied.push(r.id);
                for (const [k, v] of Object.entries(S.pending))
                    if (v.rowId === id) delete S.pending[k];
                if (S.activeRow === id) S.activeRow = S.transactions[0]?.id ?? null;
                else leaveRow(S.activeRow);
                toast(
                    "Deleted " +
                        id +
                        "." +
                        (emptied.length
                            ? " " +
                              emptied.join(", ") +
                              " had no other transaction and was garbage collected."
                            : "")
                );
                render();
            }
            function openDialog(html) {
                const d = document.getElementById("dialog");
                d.innerHTML = html;
                d.showModal();
            }
            function closeDialog() {
                document.getElementById("dialog").close();
            }

            // ---------------------------------------------------------------------------------------------
            // Events
            // ---------------------------------------------------------------------------------------------
            document.addEventListener("click", (e) => {
                const b = e.target.closest("button");
                const cell = e.target.closest("td.cell");
                const row = e.target.closest("tr[data-row]");
                if (b?.dataset.view) {
                    S.view = b.dataset.view;
                    S.editing = null;
                    return render();
                }
                if (b?.dataset.selectRule) {
                    S.selectedRule = b.dataset.selectRule;
                    return render();
                }
                if (b?.dataset.act) return act(b);
                if (cell && !cell.classList.contains("editing")) {
                    const t = S.transactions.find((x) => x.id === cell.dataset.row);
                    if (S.activeRow !== t.id) leaveRow(S.activeRow);
                    S.activeRow = t.id;
                    const f = cell.dataset.edit;
                    S.editing = {
                        id: t.id,
                        field: f,
                        draft:
                            f === "alias"
                                ? (t.alias ?? "")
                                : f === "tags"
                                  ? { tags: [...t.tags] }
                                  : { ...t.alloc }
                    };
                    return render();
                }
                if (row && !e.target.closest("td.cell")) {
                    if (S.activeRow !== row.dataset.row) {
                        S.editing = null;
                        leaveRow(S.activeRow);
                        S.activeRow = row.dataset.row;
                        render();
                    }
                }
            });
            document.addEventListener("keydown", (e) => {
                if (!S.editing) return;
                if (e.key === "Enter" && e.target.closest("td.editing")) {
                    e.preventDefault();
                    commitEdit();
                }
                if (e.key === "Escape") {
                    S.editing = null;
                    render();
                }
            });
            document.addEventListener("change", (e) => {
                const el = e.target;
                if (el.dataset.ed === "alias") S.editing.draft = el.value;
                if (el.dataset.ed === "tag") {
                    const s = new Set(S.editing.draft.tags);
                    el.checked ? s.add(el.value) : s.delete(el.value);
                    S.editing.draft.tags = [...s];
                }
                if (el.dataset.ed === "alloc")
                    S.editing.draft[el.dataset.person] = el.value === "" ? null : Number(el.value);
                if (el.dataset.ed) {
                    // live preview: re-render only the inspector
                    document.querySelector("aside")?.outerHTML &&
                        (document.querySelector("aside").outerHTML = renderInspector());
                    return;
                }
                const card = el.closest("[data-rule]");
                const r = card ? ruleById(card.dataset.rule) : null;
                if (el.dataset.reach != null && r) {
                    const d = draftFor(r);
                    const dateEl = card.querySelector("[data-reach-date]");
                    d.reach =
                        el.value === "all"
                            ? { kind: "all" }
                            : el.value === "from"
                              ? { kind: "from", date: dateEl.value }
                              : {
                                    kind: "ids",
                                    ids: new Set(
                                        r.reach.kind === "ids"
                                            ? r.reach.ids
                                            : governedBy(r, S.transactions).map((t) => t.id)
                                    )
                                };
                    return render();
                }
                if (el.dataset.reachDate != null && r) {
                    const d = draftFor(r);
                    if (d.reach.kind === "from") {
                        d.reach = { kind: "from", date: el.value };
                        return render();
                    }
                }
                if (el.dataset.reach != null && !r) {
                    const d = S.drafts.__new;
                    const dateEl = el.closest(".card").querySelector("[data-reach-date]");
                    d.reach =
                        el.value === "all"
                            ? { kind: "all" }
                            : el.value === "from"
                              ? { kind: "from", date: dateEl.value }
                              : { kind: "ids", ids: new Set() };
                    return render();
                }
                if (el.dataset.new) {
                    const d = S.drafts.__new;
                    if (el.dataset.new === "text") d.text = el.value;
                    if (el.dataset.new === "account") d.account = el.value || null;
                    if (el.dataset.new === "tag") {
                        const s = new Set(d.tags);
                        el.checked ? s.add(el.value) : s.delete(el.value);
                        d.tags = [...s];
                    }
                    return render();
                }
                if (el.id === "import-date") S.importDate = el.value;
                if (el.dataset.prefReach != null) {
                    S.prefs.reach = el.value;
                    return render();
                }
                if (el.dataset.override != null) {
                    S.override = el.checked;
                    return;
                }
                if (el.dataset.prefAuto != null) {
                    S.prefs.autoApply = el.checked;
                    return render();
                }
                if (el.dataset.pendChoice != null && r) {
                    const pend = Object.values(S.pending).find((p) => p.ruleId === r.id);
                    pend.choice = el.value;
                    S.prefs.reach = el.value;
                    return render();
                }
            });
            function act(b) {
                const a = b.dataset.act;
                const r = b.dataset.rule ? ruleById(b.dataset.rule) : null;
                const t = activeTx();
                if (a === "reset") return reset();
                if (a === "mark") {
                    const next = CHECKLIST.find(([id]) => !S.done.has(id));
                    if (next) S.done.add(next[0]);
                    return render();
                }
                if (a === "commit") return commitEdit();
                if (a === "cancel-edit") {
                    S.editing = null;
                    return render();
                }
                if (a === "import") return importRow(S.importDate);
                if (a === "delete-tx")
                    return openDialog(
                        h`<h3>Delete transaction ${b.dataset.id}?</h3><p class="small">Any rule that was applied only to it keeps existing with an empty reach.</p><div class="actions"><button class="btn danger" type="button" data-act="confirm-delete-tx" data-id="${b.dataset.id}">Delete</button><button class="btn" type="button" data-act="close">Cancel</button></div>`
                    );
                if (a === "confirm-delete-tx") {
                    closeDialog();
                    return deleteTx(b.dataset.id);
                }
                if (a === "close") return closeDialog();
                if (a === "save") return saveReach(r);
                if (a === "cancel") {
                    delete S.drafts[r.id];
                    return render();
                }
                if (a === "apply-now") {
                    const pend = Object.values(S.pending).find((p) => p.ruleId === r.id);
                    const action = pend ? defaultActionFor(r, t, pend.choice) : null;
                    if (action) runAction(r, action);
                    for (const [k, v] of Object.entries(S.pending))
                        if (v.ruleId === r.id) delete S.pending[k];
                    return render();
                }
                if (a === "fold") return fold(r, ruleById(b.dataset.host));
                if (a === "extend") return extend(r, t);
                if (a === "widen-all") {
                    const d = draftFor(r);
                    d.reach = { kind: "all" };
                    return saveReach(r);
                }
                if (a === "apply-this") {
                    setRow(t.id, (x) => applyRuleTo(r, x));
                    toast("Applied " + r.id + " to this transaction.");
                    return render();
                }
                if (a === "delete-rule") {
                    const n = governedBy(r, S.transactions).length;
                    return openDialog(
